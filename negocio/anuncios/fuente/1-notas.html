<!doctype html><html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{background:#fbfaf5;font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;color:#1c1c1e}
.bar{display:flex;justify-content:space-between;align-items:center;padding:60px 64px 30px;color:#d4a20b;font-size:44px;font-weight:600}
.fecha{text-align:center;color:#8e8e93;font-size:30px;margin-bottom:40px}
.nota{padding:0 80px}
h1{font-size:76px;font-weight:800;margin-bottom:50px;letter-spacing:-1px}
.it{display:flex;align-items:center;gap:30px;font-size:60px;margin-bottom:42px}
.ck{width:62px;height:62px;border-radius:50%;border:4px solid #c7c7cc;flex:none}
.it.x span{text-decoration:line-through;color:#8e8e93}
.it.ok .ck{background:#f5b400;border-color:#f5b400;display:grid;place-items:center}
.it.ok .ck::after{content:"";width:16px;height:30px;border:solid #fff;border-width:0 7px 7px 0;transform:rotate(45deg) translate(-2px,-4px)}
.it.ok span{font-weight:800}
.pd{font-size:50px;color:#3a3a3c;margin-top:30px;padding-left:92px}
</style></head><body>
<div class="bar"><span>‹ Notes</span><span>Done</span></div>
<div class="fecha">today, 9:47 PM</div>
<div class="nota">
<h1>plans for tonight 🌙</h1>
<div class="it x"><div class="ck"></div><span>watch a show</span></div>
<div class="it x"><div class="ck"></div><span>fall asleep by 11</span></div>
<div class="it x"><div class="ck"></div><span>both scrolling our phones</span></div>
<div class="it ok"><div class="ck"></div><span>play PICANTE with my person 🌶️🔥</span></div>
<p class="pd">(the “fire” level is dangerous 😳)</p>
</div>
</body></html>
