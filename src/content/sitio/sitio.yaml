# ─────────────────────────────────────────────────────────────────────────
#  Datos transversales del complejo. Todo lo que se repite en varias
#  páginas vive acá y en ningún otro lado.
#
#  PENDIENTE DE CONFIRMAR: dirección exacta, coordenadas, teléfonos e
#  Instagram por unidad, y la URL pública de Woki. Lo marcado con TODO
#  está tomado del brandboard o es provisorio.
# ─────────────────────────────────────────────────────────────────────────

nombre: Mirador Waikiki
desde: 1999
lema: Cuatro maneras de estar frente al mar.
firma: Una propuesta diferente, frente al mar.
descripcion: >-
  Restaurante, hotel boutique, balneario y salón de eventos sobre las rocas de
  Mar del Plata. Un mismo predio frente al mar desde 1999.

direccion:
  calle: Av. de los Trabajadores 4320 # confirmado en fichas públicas del complejo
  localidad: Mar del Plata
  provincia: Buenos Aires
  codigoPostal: B7600
  pais: AR

# Búsqueda por nombre y dirección, no por coordenadas: cae en la ficha real
# del lugar en Google Maps, con las reseñas y el «Cómo llegar» de Google.
mapaUrl: "https://www.google.com/maps/search/?api=1&query=Mirador+Waikiki%2C+Av.+de+los+Trabajadores+4320%2C+Mar+del+Plata"

coordenadas: # TODO: coordenadas exactas del acceso al predio
  lat: -38.0553
  lng: -57.5426

comoLlegar:
  - Sobre la costa, a la altura de Punta Mogotes.
  - Desde el centro, por la avenida costanera, unos quince minutos en auto.
  - Líneas de colectivo que paran en la puerta. # TODO: números de línea

estacionamiento: Estacionamiento propio dentro del predio, sin cargo para clientes.

# Un canal por unidad: número y mensaje prellenado. Cambiar un número es
# cambiar una línea acá, y todos los botones del sitio se actualizan.
contacto:
  general:
    whatsapp: "5492235466065" # TODO: confirmar cuál es el número general
    mensaje: "Hola! Escribo desde miradorwaikiki.com. Quería hacer una consulta."
  restaurante:
    whatsapp: "5492235466065" # del brandboard
    mensaje: "Hola! Quiero reservar una mesa en el restaurante de Mirador Waikiki."
  hotel:
    whatsapp: "5492235961709" # el que pasó el cliente
    mensaje: "Hola! Quiero consultar disponibilidad en el Hotel Ili Ili Boutique."
  balneario:
    whatsapp: "5492235803322" # el que pasó el cliente
    mensaje: "Hola! Quiero consultar por una carpa en el balneario de Mirador Waikiki."
  eventos:
    whatsapp: "5492236333330" # el que pasó el cliente
    mensaje: "Hola! Quiero consultar por un evento en Mirador Waikiki."

# VERIFICAR con un click: no pude abrir wokiapp.com desde el entorno de
# desarrollo. Si redirige a otra dirección, cambiá esta línea y listo.
# ── Verificación de propiedad ────────────────────────────────────────────
# Pegar acá el valor del atributo content= que da cada panel. Sólo el
# código, sin la etiqueta <meta> entera. Vacío = no se emite nada.
#
#   Google Search Console → Propiedad de prefijo de URL → Etiqueta HTML
#   Bing Webmaster Tools  → Agregar sitio → Etiqueta meta
verificacion:
  google: ""
  bing: ""
  facebook: ""

# ── Gift card ────────────────────────────────────────────────────────────
# La página vive en /giftcard y NO se enlaza desde ninguna sección. Mientras
# no esté terminada, nadie tiene que llegar por navegación.
giftcard:
  titulo: Regalá una tarde frente al mar
  bajada: >-
    Una gift card del complejo, para usar en el restaurante, en el hotel o en
    el balneario.
  intro:
    - >-
      Elegís el monto, nos contás para quién es y nosotros preparamos la
      tarjeta. Se puede usar en cualquiera de las cuatro unidades.
    - >-
      No hay un monto fijo: ponés el que quieras y quien la reciba lo usa
      como prefiera.
  pasos:
    - titulo: Completás el formulario
      texto: Con tus datos, los de quien la recibe y el monto.
    - titulo: Te escribimos
      texto: Coordinamos el pago por transferencia, sin pasarela ni tarjeta.
    - titulo: Enviamos la tarjeta
      texto: Al mail de quien la recibe, o al tuyo si la querés entregar vos.
  aviso: >-
    Por ahora el pago no se hace en el sitio. El formulario abre un WhatsApp
    con el pedido ya escrito y lo terminamos de coordinar por ahí.
  montoMinimo: 10000
  # A lo ancho de la pantalla: pide una foto de 2000 px o más. La terraza de
  # los macramés tiene 1333 y en un monitor de 1920 se estiraba 1,44 veces.
  foto:
    src: ../../assets/fotos/restaurante/tallarines-vino.jpg
    alt: >-
      Un plato de tallarines con salsa de tomate y queso rallado, con una
      botella de tinto y copas de vino blanco sobre la mesa junto al ventanal
  fotoTarjeta:
    src: ../../assets/fotos/complejo/predio-dron-vertical.jpg
    alt: >-
      El complejo visto desde un dron: el restaurante sobre las rocas, la
      pileta, las carpas sobre la arena y el mar abierto

woki: "https://www.wokiapp.com/restaurante/mirador-waikiki"

redes:
  - { nombre: "Instagram del restaurante", url: "https://www.instagram.com/miradorwaikiki/" }
  - { nombre: "Instagram del complejo", url: "https://www.instagram.com/complejowaikiki/" }
  - { nombre: "Instagram del hotel", url: "https://www.instagram.com/ili.ili.hotel/" }

# ─────────────────────────────────────────────────────────────────────────
#  Prueba social. NO INVENTES TESTIMONIOS: una reseña escrita por nosotros
#  es una reseña falsa, y si alguien la busca no la encuentra.
#
#  Copiá reseñas reales de Google, Tripadvisor o Instagram. Con tres
#  cargadas la sección aparece sola en el home; vacío, no se renderiza.
#
#  testimonios:
#    - texto: >-
#        El texto tal cual lo escribió la persona, sin retocar.
#      nombre: Nombre y apellido, o como figure en la reseña
#      origen: Google        # Google | Tripadvisor | Instagram | Booking | Facebook
#      fecha: "2026-01"      # opcional
# ─────────────────────────────────────────────────────────────────────────
testimonios: []

