orden: 4
nombre: Eventos
nombreLargo: Eventos en Mirador Waikiki
color: terracota
ornamento: ammonite

titular: Casarse con el mar de fondo.
bajada: Casamientos y eventos privados frente al mar
firma: Se celebra donde se veranea.
intro:
  - >-
    El complejo entero se puede reservar para un evento: el salón con vista a la
    rompiente, las terrazas y el parque sobre la costa. Los invitados de afuera
    se alojan en el hotel del mismo predio, a metros del salón.
  - >-
    De día es el mar por los tres ventanales; de noche, la barra bajo las
    lámparas y las luces de la costa de fondo.
  - >-
    La producción integral de casamientos y eventos sociales la hace Mar
    Eventos, que trabaja acá hace años y conoce el lugar de memoria.

# Provisoria: recorte de la foto aérea del predio, para que el sitio no
