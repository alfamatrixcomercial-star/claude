orden: 4
nombre: Eventos
nombreLargo: Eventos en Mirador Waikiki
color: terracota
ornamento: ammonite

titular: Casarse con el mar de fondo.
bajada: Casamientos y eventos privados frente al mar
firma: Se celebra donde se veranea.
intro:
  - >-
    El complejo entero se puede reservar para un evento: el salón con vista a la
    rompiente, las terrazas y el parque sobre la costa. Los invitados de afuera
    se alojan en el hotel del mismo predio, a metros del salón.
  - >-
    De día es el mar por los tres ventanales; de noche, la barra bajo las
    lámparas y las luces de la costa de fondo.
  - >-
    La producción integral de casamientos y eventos sociales la hace Mar
    Eventos, que trabaja acá hace años y conoce el lugar de memoria.

# Provisoria: recorte de la foto aérea del predio, para que el sitio no
# muestre bloques vacíos. Reemplazar por una foto propia de la unidad.
hero:
  src: ../../assets/fotos/eventos/salon-atardecer.jpg
  alt: >-
    El salón principal al atardecer, con el techo de madera a dos aguas, los
    sillones blancos y el mar por los ventanales
  foco: centro

galeria:
  - src: ../../assets/fotos/eventos/lounge-tablas.jpg
    alt: >-
      El sector lounge con las tablas de surf en la pared, mesas redondas de madera y flores
  - src: ../../assets/fotos/eventos/trago-barra.jpg
    alt: >-
      Un trago servido sobre la barra de noche, con las botellas iluminadas de fondo
  - src: ../../assets/fotos/restaurante/salon-lamparas.jpg
    alt: >-
      El salón bajo las lámparas de mimbre, montado para una noche
  - src: ../../assets/fotos/restaurante/atardecer-ventanal.jpg
    alt: >-
      El atardecer sobre la costa, visto desde el ventanal del salón
  - src: ../../assets/fotos/restaurante/coctel-servido.jpg
    alt: >-
      El bartender terminando un cóctel en la barra del salón

