orden: 3
nombre: Balneario
nombreLargo: Balneario Mirador Waikiki
color: teal
ornamento: coral

titular: Carpas y sombrillas sobre la arena.
bajada: Temporada de verano, por día o por temporada completa
firma: El mismo predio, con los pies en la arena.
intro:
  # TODO: confirmar modalidades reales
  - >-
    Hileras de carpas blancas y sombrillas sobre la arena, al pie del complejo
    y a la altura de Punta Mogotes. El balneario abre en diciembre y cierra a
    fines de marzo.
  - >-
    Se contrata por día, por quincena o por la temporada completa. El auto
    queda en el estacionamiento del predio y el restaurante está a pasos: se
    almuerza o se toma algo frente al mar sin salir del complejo.
  - >-
    Los huéspedes de Ili Ili también pueden contratarlo, aparte de la
    habitación.

hero:
  src: ../../assets/fotos/complejo/predio-dron.jpg
  alt: >-
    El complejo visto desde el mar con un dron: la playa con las filas de
    carpas, el restaurante sobre las rocas, las piletas y el parque
  foco: centro

# El orden importa: las dos primeras de cada unidad son las que salen en la
# banda de fotos del home. Sólo playa y mar: las del restaurante van en el
# restaurante, aunque se vea la arena desde la terraza.
galeria:
  - src: ../../assets/fotos/balneario/carpas-dron.jpg
    alt: >-
      El balneario visto desde un dron: las hileras de carpas blancas y las
      sombrillas sobre la arena, con la pileta y el restaurante detrás
    foco: abajo
  - src: ../../assets/fotos/complejo/mar-surfistas.jpg
    alt: >-
      El mar de Mar del Plata desde el aire, con surfistas esperando la ola en
      agua verde oscuro
  - src: ../../assets/fotos/balneario/mar-plantas.jpg
    alt: >-
      El mar visto entre las plantas del predio, con la ciudad de Mar del Plata a lo lejos

