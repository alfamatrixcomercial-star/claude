orden: 3
nombre: Balneario
nombreLargo: Balneario Mirador Waikiki
color: teal
ornamento: coral

titular: Carpas y sombrillas sobre la arena.
bajada: Temporada de verano, por día o por temporada completa
firma: El mismo predio, con los pies en la arena.
intro:
  # TODO: confirmar modalidades reales
  - >-
    El balneario abre en diciembre y cierra a fines de marzo. Se contrata por
    día, por quincena o por temporada completa, y el acceso al restaurante y al
    hotel es el mismo predio.
  - >-
    Los huéspedes de Ili Ili tienen acceso durante su estadía.

hero:
  src: ../../assets/fotos/balneario/carpas-arena.jpg
  alt: >-
    Las carpas blancas del balneario alineadas sobre la arena, con las
    reposeras, las sombrillas y el mar detrás
  foco: centro

# El orden importa: las dos primeras de cada unidad son las que salen en la
# banda de fotos del home.
galeria:
  - src: ../../assets/fotos/complejo/predio-dron.jpg
    alt: >-
      El complejo entero visto desde el mar con un dron: las piletas, el parque y la playa
  - src: ../../assets/fotos/balneario/desayuno-baranda.jpg
    alt: >-
      Una mesa servida junto a la baranda, con la playa abajo
  - src: ../../assets/fotos/balneario/baranda-mar.jpg
    alt: >-
      La baranda blanca del complejo sobre la playa, con el mar y la rompiente
  - src: ../../assets/fotos/balneario/mar-plantas.jpg
    alt: >-
      El mar visto entre las plantas del predio, con la ciudad de Mar del Plata a lo lejos

temporada:
  desde: "12-01"
  hasta: "03-31"
  abierta: Temporada abierta
  cerrada: Temporada desde el 1 de diciembre
