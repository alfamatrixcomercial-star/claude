  - src: ../../assets/fotos/restaurante/barra-lamparas.jpg
    alt: >-
      La barra iluminada bajo las lámparas de mimbre colgadas del techo alto
  - src: ../../assets/fotos/restaurante/mesa-puesta.jpg
