  - src: ../../assets/fotos/restaurante/ensalada.jpg
    alt: >-
      Ensalada verde con langostinos y croutones, servida en plato hondo blanco
  - src: ../../assets/fotos/restaurante/burrata.jpg
    alt: >-
      Burrata entera sobre hojas verdes con nueces y tomates, servida en fuente
  - src: ../../assets/fotos/restaurante/calamares.jpg
    alt: >-
      Plato de rabas doradas con gajos de limón sobre la mesa de madera
  - src: ../../assets/fotos/restaurante/milanesa.jpg
