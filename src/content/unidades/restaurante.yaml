orden: 1
nombre: Restaurante
nombreLargo: Restaurante Mirador Waikiki
color: verde
ornamento: vieira

titular: Cocina de mar y fuego, sobre las rocas.
bajada: Abierto desde las 8, con el mar de frente
firma: Una propuesta diferente, frente al mar.
intro:
  # TODO: confirmar propuesta gastronómica y estilo de cocina
  - >-
    Abre a las ocho de la mañana y no cierra hasta la tarde: desayuno con el mar
    de frente, almuerzo, café de la tarde y, los viernes y sábados, también la
    noche. El salón mira al agua por tres lados, con la misma vista con la que
    abrimos en 1999.
  - >-
    Los viernes y sábados el salón se arma para la cena show, con entrada sin
    cargo y arranque a las 22.

hero:
  src: ../../assets/fotos/restaurante/terraza-almuerzo.jpg
  alt: >-
    La terraza del restaurante llena a la hora del almuerzo, bajo los tejidos de
    macramé, con las sombrillas y el mar al fondo
  foco: centro

# Del video del salón: panel central recortado, sin audio y comprimido.
video:
  src: /video/waikiki-salon
  poster: /video/waikiki-salon-poster.jpg
  titulo: El lugar en diez segundos
  descripcion: >-
    Diez segundos por el salón, la barra, la cava y la terraza, un mediodía de
    sol. Sin audio.

galeria:
  - src: ../../assets/fotos/restaurante/salon-lamparas.jpg
    alt: >-
      El salón bajo las lámparas de mimbre colgadas del techo alto, con la barra y las tablas de surf al fondo
  - src: ../../assets/fotos/restaurante/servicio-desayuno.jpg
    alt: >-
      Una moza sirviendo el desayuno en la terraza, con la bandeja de cafés y jugos
  - src: ../../assets/fotos/restaurante/desayuno-arriba.jpg
    alt: >-
      Desayuno visto desde arriba: huevos revueltos con palta y tostadas, bowl de frutas con granola, café y jugo de naranja
  - src: ../../assets/fotos/restaurante/desayuno-terraza.jpg
    alt: >-
      La mesa del desayuno servida en la terraza de madera, con el mar detrás de la baranda blanca
  - src: ../../assets/fotos/restaurante/mesa-vista.jpg
    alt: >-
      Una mesa puesta junto a la baranda, con la costa de Mar del Plata al fondo
  - src: ../../assets/fotos/restaurante/barra-mozo.jpg
    alt: >-
      Un mozo detrás de la barra de madera, con la luz cálida del salón
  - src: ../../assets/fotos/restaurante/atardecer-ventanal.jpg
    alt: >-
      El atardecer visto desde el ventanal del salón, con el cielo naranja sobre la costa
  - src: ../../assets/fotos/restaurante/taza-logo.jpg
    alt: >-
      Una taza de café con leche con el logo de Mirador Waikiki, servida por el barista
  - src: ../../assets/fotos/restaurante/coctel-chispas.jpg
    alt: >-
      El bartender flameando un cóctel en la barra, con las chispas cayendo sobre el vaso
  - src: ../../assets/fotos/restaurante/coctel-flameado.jpg
    alt: >-
      Un cóctel flameado sobre la barra, con la llama azul todavía encendida
  - src: ../../assets/fotos/restaurante/coctel-colado.jpg
    alt: >-
      El bartender colando un trago en la copa, detrás de la barra
  - src: ../../assets/fotos/restaurante/langostinos-burrata.jpg
    alt: >-
      Ensalada de langostinos con burrata y tomates, servida en plato hondo blanco
  - src: ../../assets/fotos/restaurante/cazuela-mariscos.jpg
    alt: >-
      Cazuela de mariscos con langostinos, mejillones y vieiras, con una copa de vino tinto al lado
  - src: ../../assets/fotos/restaurante/ravioles.jpg
    alt: >-
      Ravioles negros en salsa de crema con queso rallado y pimentón
  - src: ../../assets/fotos/restaurante/sorrentinos.jpg
    alt: >-
      Sorrentinos en salsa de tomate con albahaca, sobre el mantel rayado
  - src: ../../assets/fotos/restaurante/bife-papas.jpg
    alt: >-
      Bife con papas y hongos, con una copa de vino tinto y la botella detrás
  - src: ../../assets/fotos/restaurante/spritz-rabas.jpg
    alt: >-
      Un spritz y un plato de rabas con limón, sobre la mesa de la terraza frente al mar

