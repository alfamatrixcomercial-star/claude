titular: Cocina de mar y fuego, sobre las rocas.
bajada: Almuerzo, cena y cena show frente al mar
firma: Una propuesta diferente, frente al mar.
intro:
  - >-
    El salón mira al agua por tres lados. Se come mirando la rompiente, con la
    misma vista con la que abrimos en 1999 y con una carta que cambia cuando
    cambia lo que llega del puerto.
  # TODO: confirmar propuesta gastronómica y estilo de cocina
  - >-
    Los viernes y sábados el salón se arma para la cena show, con entrada sin
    cargo y arranque a las 22. Los fines de semana al mediodía la cocina pasa a
    brunch.

