orden: 2
nombre: Hotel
nombreLargo: Hotel Ili Ili Boutique
color: arena
ornamento: caracol

# Copy propio de la marca, del video del hotel.
titular: Amanecé frente al mar.
bajada: El primer hotel sobre la primera línea de playa
firma: Amanecé frente al mar.
intro:
  - >-
    Ili Ili es el primer hotel de Mar del Plata sobre la primera línea de playa.
    Está dentro del complejo, frente al mar.
  - >-
    En verano, el balneario del complejo está en el mismo predio y se
    contrata aparte. El restaurante está a metros, abierto desde las ocho de la
    mañana.

marca:
  src: ../../assets/logos/ili-ili.png
  alt: Ili Ili Hotel Boutique

hero:
  src: ../../assets/fotos/hotel/edificio-parque.jpg
  alt: >-
    El restaurante del complejo visto desde el parque del predio, con los
    árboles en primer plano
  foco: centro

# La tarjeta del hotel en el home: una habitación, que es lo que se busca.
fotoPuerta:
  src: ../../assets/fotos/hotel/habitacion-vista-mar.jpg
  alt: >-
    Una habitación del hotel con la cama tendida, los sillones junto al
    ventanal y el mar y la ciudad detrás de los balcones

# Video vertical del hotel, tal como llegó: 720x1280 de teléfono. Va en un
# panel dentro del hero, en su proporción, para no ampliarlo ni recortarlo.
heroVideo:
  src: /video/ili-ili-hero
  poster: /video/ili-ili-hero-poster.jpg
  alt: >-
    Amanecer desde la terraza del hotel: el deck de madera, una silla mirando
    al mar y el sol saliendo sobre el agua

# Vacía hasta que lleguen fotos del hotel en buena resolución: las que
# había eran de 1024 px y muy comprimidas (ver _sin-usar/LEEME.md). Sin
# fotos, el bloque de galería no se muestra.
galeria: []

estadoFijo: Abierto todo el año

ficha:
  - { clave: Balneario, valor: "En el predio, se contrata aparte" }
  - { clave: Restaurante, valor: "A metros, desde las 8" }
  - { clave: Cochera, valor: "Sí, dentro del predio" }

ctas:
  - {
      texto: Ver habitaciones y reservar,
      textoCorto: Ver habitaciones,
      tipo: externo,
      href: "https://iliilihotelboutique.com.ar",
    }
  - { texto: Consultar por WhatsApp, tipo: whatsapp, contexto: hotel }

listas: []

# Las habitaciones, tarifas y disponibilidad se manejan en el sitio propio del
# hotel. Acá se muestra el lugar y se deriva, igual que con eventos.
derivacion:
  rotulo: Alojamiento
  titulo: Las habitaciones se ven en el sitio del hotel
  texto: >-
    Ili Ili tiene su propio sitio, con las habitaciones, los servicios y la
    disponibilidad al día. Desde acá vas directo.
  texto_cta: Ir a iliilihotelboutique.com.ar
  url: "https://iliilihotelboutique.com.ar"
  logo:
    src: ../../assets/logos/ili-ili.png
    alt: Logo de Ili Ili Hotel Boutique
  foto:
    src: ../../assets/fotos/complejo/predio-dron.jpg
    alt: >-
      El complejo visto desde el mar con un dron: el restaurante, las piletas,
      el parque y la playa sobre la costa de Mar del Plata

fotoRelato:
  src: ../../assets/fotos/balneario/mar-plantas.jpg
  alt: >-
    El mar visto entre las plantas del predio, con la ciudad de Mar del Plata
    a lo lejos

seo:
  titulo: Ili Ili Hotel Boutique, primera línea de playa
  descripcion: >-
    El primer hotel de Mar del Plata sobre la primera línea de playa, dentro del
    complejo Mirador Waikiki, frente al mar y junto a su balneario.
schema: LodgingBusiness
