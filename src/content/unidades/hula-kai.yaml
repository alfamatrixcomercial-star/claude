orden: 4
nombre: Hula Kai
nombreLargo: Hula Kai en Mirador Waikiki
color: celeste
ornamento: caracola

titular: La pileta frente al mar, todo el verano.
bajada: Pileta, camastros y un salón con gastronomía, sólo en verano
firma: Abre con el verano.

# El logo de Hula Kai, en la tinta del sitio (el original es gris claro para
# fondo blanco y en la placa no se leería).
marca:
  src: ../../assets/logos/hula-kai.png
  alt: Hula Kai by Waikiki
intro:
  - >-
    Hula Kai es el sector de la pileta de Mirador Waikiki: agua frente al mar,
    sombrillas y camastros alrededor, y la costa de Mar del Plata de un lado a
    otro del horizonte.
  - >-
    Junto a la pileta está su salón, luminoso y de ventanales, con barra,
    sillones de ratán y tablas de surf en las paredes. En temporada tiene
    carta propia: café y pastelería, platos para el mediodía, algo para picar,
    postres y tragos.
  - >-
    Abre sólo en verano. Además, el salón se reserva para eventos privados de
    25 a 50 personas, con la producción de Mar Eventos.

# Fotos del salón y de la pileta, de mareventos.com.ar/salon-hula-kai.
hero:
  src: ../../assets/fotos/hula-kai/piscina-mar.jpg
  alt: >-
    La pileta de agua turquesa con gente alrededor, sombrillas y camastros, y
    el mar y la ciudad al fondo, vista desde la baranda blanca de madera
  foco: centro

galeria:
  - src: ../../assets/fotos/hula-kai/interior-bar.jpg
    alt: >-
      Un rincón del salón con un sillón de ratán, almohadones a rayas, plantas
      y dos tablas de surf de madera en la pared
  - src: ../../assets/fotos/hula-kai/tablas-detalle.jpg
    alt: >-
      Dos tablas de surf de madera colgadas en la pared del salón, con frutas
      fuera de foco adelante

fotoRelato:
  src: ../../assets/fotos/hula-kai/interior-amplio.jpg
  alt: >-
    El salón de Hula Kai con sillones de ratán, mesas de madera, plantas y
    tablas de surf en las paredes, con luz de día por los ventanales
cartaFoto:
  src: ../../assets/fotos/hula-kai/interior-full.jpg
  alt: >-
    La barra de Hula Kai con su nombre al frente, la cafetera y las botellas,
    y el salón con mesas y ventanales detrás

