<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Waikiki — Reservas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --ocean: #0077b6;
      --ocean-dark: #005f8e;
      --bg: #f0f7ff;
      --card: #fff;
      --text: #1a2332;
      --muted: #6b7d8f;
      --border: #dde8f0;
      --yellow: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

    header {
      background: linear-gradient(135deg, var(--ocean), var(--ocean-dark));
      color: #fff;
      padding: 14px 18px 10px;
      position: sticky; top: 0; z-index: 100;
      box-shadow: 0 2px 8px rgba(0,119,182,.3);
    }
    header h1 { font-size: 19px; font-weight: 700; }
    #last-update { font-size: 11px; opacity: .75; margin-top: 2px; }

    .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; background: var(--border); gap: 1px; border-bottom: 1px solid var(--border); }
    .stat { background: #fff; padding: 10px 6px; text-align: center; }
    .stat-n { font-size: 22px; font-weight: 800; color: var(--ocean); }
    .stat-l { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

    .tabs { display: flex; background: #fff; border-bottom: 2px solid var(--border); }
    .tab { flex: 1; padding: 12px 4px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -2px; user-select: none; }
    .tab.active { color: var(--ocean); border-bottom-color: var(--ocean); }

    .content { padding: 12px 14px; max-width: 600px; margin: 0 auto; }

    .empty { text-align: center; padding: 50px 20px; color: var(--muted); }
    .empty .icon { font-size: 44px; margin-bottom: 10px; }

    .group-label { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .7px; margin: 14px 0 7px; }
    .group-label:first-child { margin-top: 4px; }

    .card { background: var(--card); border-radius: 14px; padding: 14px 15px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); border-left: 4px solid var(--yellow); }
    .card.Confirmada { border-left-color: var(--green); }
    .card.Cancelada { border-left-color: var(--red); opacity: .6; }

    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 9px; }
    .card-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
    .card-time { font-size: 20px; font-weight: 800; color: var(--ocean); white-space: nowrap; margin-left: 8px; }

    .badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 600; margin-top: 3px; }
    .badge.Pendiente { background: #fef3c7; color: #92400e; }
    .badge.Confirmada { background: #d1fae5; color: #065f46; }
    .badge.Cancelada { background: #fee2e2; color: #991b1b; }

    .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 10px; font-size: 13px; color: var(--muted); margin-bottom: 11px; }
    a.phone { color: var(--ocean); text-decoration: none; }

    .card-actions { display: flex; gap: 8px; }
    .btn { flex: 1; padding: 9px; border-radius: 10px; border: none; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn:active { opacity: .8; }
    .btn:disabled { opacity: .3; cursor: default; }
    .btn-ok { background: #d1fae5; color: #065f46; }
    .btn-ko { background: #fee2e2; color: #991b1b; }

    .footer { text-align: center; padding: 14px; font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>

<header>
  <h1>🌊 Waikiki — Reservas</h1>
  <div id="last-update">Cargando...</div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-n" id="s-hoy">—</div><div class="stat-l">Hoy</div></div>
  <div class="stat"><div class="stat-n" id="s-pend">—</div><div class="stat-l">Pendientes</div></div>
  <div class="stat"><div class="stat-n" id="s-conf">—</div><div class="stat-l">Confirmadas</div></div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="hoy" onclick="setTab(this)">Hoy</div>
  <div class="tab" data-tab="proximas" onclick="setTab(this)">Próximas</div>
  <div class="tab" data-tab="todas" onclick="setTab(this)">Todas</div>
</div>

<div class="content" id="content"><div class="empty"><div class="icon">⏳</div><p>Cargando reservas...</p></div></div>
<div class="footer">Actualización automática cada 30 seg</div>

<script>
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  let tab = 'hoy';
  let data = [];

  function arDate(offset) {
    const d = new Date();
    d.setDate(d.getDate() + (offset || 0));
    return d.toLocaleDateString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit' });
  }

  function setTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    tab = el.dataset.tab;
    render();
  }

  function filter() {
    const hoy = arDate(0), man = arDate(1);
    if (tab === 'hoy') return data.filter(r => r.fechaReserva === hoy || r.fechaReserva === '-');
    if (tab === 'proximas') return data.filter(r => r.estado !== 'Cancelada');
    return data;
  }

  function sorted(list) {
    return [...list].sort((a, b) => {
      const fd = (x) => x.fechaReserva === '-' ? 'zz' : x.fechaReserva;
      if (fd(a) !== fd(b)) return fd(a).localeCompare(fd(b));
      return (a.horario || '').localeCompare(b.horario || '');
    });
  }

  function grouped(list) {
    const g = {};
    for (const r of list) {
      const k = r.fechaReserva || 'Sin fecha';
      (g[k] = g[k] || []).push(r);
    }
    return g;
  }

  function card(r) {
    const tipo = r.tipo ? r.tipo[0].toUpperCase() + r.tipo.slice(1) : '—';
    const tel = r.telefono !== '-' ? '<a class="phone" href="tel:' + r.telefono + '">' + r.telefono + '</a>' : '—';
    return '<div class="card ' + r.estado + '" id="c' + r.id + '">' +
      '<div class="card-top"><div><div class="card-name">' + r.nombre + '</div><span class="badge ' + r.estado + '">' + r.estado + '</span></div>' +
      '<div class="card-time">' + (r.horario || '—') + ' hs</div></div>' +
      '<div class="card-meta"><span>👥 ' + r.personas + ' persona(s)</span><span>🍽️ ' + tipo + '</span>' +
      '<span>📅 ' + r.fechaReserva + '</span><span>📞 ' + tel + '</span></div>' +
      '<div class="card-actions">' +
      '<button class="btn btn-ok" onclick="upd(\'' + r.id + '\',\'Confirmada\')" ' + (r.estado !== 'Pendiente' ? 'disabled' : '') + '>✓ Confirmar</button>' +
      '<button class="btn btn-ko" onclick="upd(\'' + r.id + '\',\'Cancelada\')" ' + (r.estado === 'Cancelada' ? 'disabled' : '') + '>✕ Cancelar</button>' +
      '</div></div>';
  }

  function stats() {
    const hoy = arDate(0);
    document.getElementById('s-hoy').textContent = data.filter(r => r.fechaReserva === hoy).length;
    document.getElementById('s-pend').textContent = data.filter(r => r.estado === 'Pendiente').length;
    document.getElementById('s-conf').textContent = data.filter(r => r.estado === 'Confirmada').length;
  }

  function render() {
    const list = sorted(filter());
    const el = document.getElementById('content');
    if (!list.length) { el.innerHTML = '<div class="empty"><div class="icon">📭</div><p>Sin reservas para mostrar</p></div>'; return; }
    const g = grouped(list);
    const hoy = arDate(0), man = arDate(1);
    let html = '';
    for (const [date, items] of Object.entries(g)) {
      const lbl = date === hoy ? '📅 Hoy — ' + date : date === man ? '📅 Mañana — ' + date : date === '-' ? 'Sin fecha' : '📅 ' + date;
      html += '<div class="group-label">' + lbl + '</div>' + items.map(card).join('');
    }
    el.innerHTML = html;
  }

  async function upd(id, estado) {
    const res = await fetch('/api/reservas/' + id + '?token=' + TOKEN, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado })
    }).then(r => r.json()).catch(() => null);
    if (res) { const i = data.findIndex(r => r.id === id); if (i >= 0) data[i] = res; stats(); render(); }
  }

  async function load() {
    const res = await fetch('/api/reservas?token=' + TOKEN).catch(() => null);
    if (!res || !res.ok) { document.getElementById('content').innerHTML = '<div class="empty"><div class="icon">🔒</div><p>Token inválido</p></div>'; return; }
    data = await res.json();
    stats();
    render();
    const t = new Date().toLocaleTimeString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit' });
    document.getElementById('last-update').textContent = 'Actualizado a las ' + t;
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
