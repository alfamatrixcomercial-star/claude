<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Waikiki — Reservas</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    :root {
      --sand:        #dbd2b5;
      --sand-light:  #e8e1cd;
      --white:       #ffffff;
      --border:      #cab892;
      --border-light:#ddd3bc;
      --sage:        #6e8f7a;
      --sage-dark:   #5d7d6a;
      --text:        #1f2d27;
      --muted:       #6a7d72;
      --success:     #4E8A48;
      --error:       #C83830;
      --pending:     #b07a2a;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--sand);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(219,210,181,.94);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 13px 18px 11px;
    }
    .header-inner { max-width: 640px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-logo { width: 36px; height: 36px; border-radius: 10px; background: var(--sage); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
    .header-title { font-size: 16px; font-weight: 800; letter-spacing: -.3px; }
    .header-sub { font-size: 11px; color: var(--muted); font-weight: 500; margin-top: 1px; }
    .header-pill { font-size: 11px; color: var(--muted); font-weight: 500; background: var(--white); border: 1px solid var(--border-light); padding: 4px 10px; border-radius: 20px; white-space: nowrap; }

    /* ── STATS ── */
    .stats-wrap { padding: 14px 16px 0; }
    .stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; max-width: 640px; margin: 0 auto; }
    .stat { background: var(--white); border: 1px solid var(--border-light); border-radius: 16px; padding: 14px 10px 12px; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .stat-n { font-size: 28px; font-weight: 800; color: var(--sage); line-height: 1; }
    .stat-n.warn { color: var(--error); }
    .stat-l { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-top: 5px; }

    /* ── TABS ── */
    .tabs-wrap { padding: 12px 16px 0; }
    .tabs { display: flex; gap: 5px; max-width: 640px; margin: 0 auto; background: var(--white); border: 1px solid var(--border-light); border-radius: 14px; padding: 4px; }
    .tab { flex: 1; padding: 9px 4px; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--muted); border-radius: 10px; transition: all .18s; user-select: none; }
    .tab.active { background: var(--sage); color: #fff; box-shadow: 0 2px 8px rgba(110,143,122,.3); }

    /* ── CONTENT ── */
    .content { padding: 14px 16px 90px; max-width: 640px; margin: 0 auto; }

    /* ── EMPTY ── */
    .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
    .empty .icon { font-size: 46px; margin-bottom: 12px; }
    .empty p { font-size: 15px; font-weight: 500; }

    /* ── GROUP LABEL ── */
    .group-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 20px 0 10px; display: flex; align-items: center; gap: 8px; }
    .group-label:first-child { margin-top: 4px; }
    .group-label::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }

    /* ── CARD ── */
    .card { background: var(--white); border: 1px solid var(--border-light); border-radius: 18px; padding: 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); position: relative; overflow: hidden; animation: fadeUp .2s ease both; }
    .card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--pending); border-radius: 18px 0 0 18px; }
    .card.Confirmada::before { background: var(--success); }
    .card.Cancelada::before { background: var(--error); }
    .card.Cancelada { opacity: .55; }

    /* ── CARD TOP ── */
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
    .card-name { font-size: 16px; font-weight: 700; line-height: 1.2; }
    .card-right { text-align: right; flex-shrink: 0; margin-left: 8px; }
    .card-time { font-size: 22px; font-weight: 800; color: var(--sage); line-height: 1; }
    .card-time-lbl { font-size: 10px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .4px; margin-top: 2px; }

    /* ── BADGE ── */
    .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; margin-top: 4px; }
    .badge.Pendiente { background: #fef3c7; color: #92400e; }
    .badge.Confirmada { background: #dcf5da; color: #2d6b28; }
    .badge.Cancelada { background: #fee2e2; color: #991b1b; }

    /* ── CARD META ── */
    .card-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-bottom: 14px; }
    .meta-item { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); font-weight: 500; }
    a.phone { color: var(--sage); text-decoration: none; font-weight: 600; }

    /* ── DIVIDER ── */
    .divider { height: 1px; background: var(--border-light); margin-bottom: 12px; }

    /* ── ACTIONS ── */
    .card-actions { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn { flex: 1; padding: 10px; border-radius: 12px; border: none; font-size: 13px; font-weight: 700; cursor: pointer; transition: opacity .15s, transform .1s; font-family: inherit; }
    .btn:active { transform: scale(.97); opacity: .85; }
    .btn:disabled { opacity: .25; cursor: default; transform: none; }
    .btn-ok { background: var(--sage); color: #fff; }
    .btn-ko { background: #fee2e2; color: var(--error); }

    /* ── MESA ── */
    .mesa-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .mesa-chip { display: inline-flex; align-items: center; gap: 5px; padding: 5px 11px 5px 9px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-light); background: var(--sand); color: var(--muted); transition: all .15s; user-select: none; }
    .mesa-chip:hover { background: var(--sand-light); border-color: var(--border); }
    .mesa-chip.set { background: #e6f4e8; border-color: #9ecfa0; color: var(--success); }
    .mesa-caret { font-size: 10px; opacity: .6; }

    .mesa-panel { display: none; margin-top: 10px; background: var(--sand); border: 1px solid var(--border-light); border-radius: 14px; padding: 12px; }
    .mesa-panel.open { display: block; }
    .mesa-panel-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 8px; }
    .mesa-select { width: 100%; border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px; font-size: 13px; background: var(--white); font-family: inherit; color: var(--text); margin-bottom: 8px; }
    .mesa-actions { display: flex; gap: 7px; }
    .mesa-actions .btn { padding: 9px 12px; font-size: 12px; }

    /* ── FOOTER ── */
    .footer { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(219,210,181,.93); backdrop-filter: blur(10px); border-top: 1px solid var(--border-light); text-align: center; padding: 11px 16px; font-size: 11px; color: var(--muted); font-weight: 500; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    /* ── ALERTAS ── */
    .alerts-wrap { padding: 12px 16px 0; }
    .alert-card {
      max-width: 640px; margin: 0 auto 8px;
      background: #fff3f3; border: 1.5px solid var(--error);
      border-radius: 16px; padding: 14px 16px;
      display: flex; align-items: center; gap: 12px;
      animation: fadeUp .2s ease both, pulse 2.5s ease-in-out infinite;
    }
    .alert-icon { font-size: 26px; flex-shrink: 0; }
    .alert-body { flex: 1; min-width: 0; }
    .alert-title { font-size: 14px; font-weight: 700; color: var(--error); }
    .alert-sub { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .btn-dismiss { padding: 9px 14px; border-radius: 10px; border: none; background: var(--error); color: #fff; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; transition: opacity .15s; }
    .btn-dismiss:active { opacity: .8; }
    @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(200,56,48,.25); } 50% { box-shadow: 0 0 0 7px rgba(200,56,48,0); } }

    /* ── LEADS ── */
    .lead-card { background: var(--white); border: 1px solid var(--border-light); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.06); display: flex; align-items: flex-start; gap: 12px; animation: fadeUp .2s ease both; }
    .lead-icon { font-size: 26px; flex-shrink: 0; margin-top: 2px; }
    .lead-body { flex: 1; min-width: 0; }
    .lead-detalle { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .lead-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .lead-section-title { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin: 18px 0 10px; display: flex; align-items: center; gap: 8px; }
    .lead-section-title:first-child { margin-top: 4px; }
    .lead-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border-light); }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="header-brand">
      <div class="header-logo">🌊</div>
      <div>
        <div class="header-title">Mirador Waikiki</div>
        <div class="header-sub">Panel de reservas</div>
      </div>
    </div>
    <div class="header-pill" id="last-update">Cargando...</div>
  </div>
</header>

<div id="alerts-section" style="display:none">
  <div class="alerts-wrap" id="alerts-list"></div>
</div>

<div class="stats-wrap">
  <div class="stats">
    <div class="stat"><div class="stat-n" id="s-hoy">—</div><div class="stat-l">Hoy</div></div>
    <div class="stat"><div class="stat-n" id="s-pend">—</div><div class="stat-l">Pendientes</div></div>
    <div class="stat"><div class="stat-n" id="s-conf">—</div><div class="stat-l">Confirmadas</div></div>
  </div>
</div>

<div class="tabs-wrap">
  <div class="tabs">
    <div class="tab active" data-tab="hoy" onclick="setTab(this)">Hoy</div>
    <div class="tab" data-tab="proximas" onclick="setTab(this)">Próximas</div>
    <div class="tab" data-tab="todas" onclick="setTab(this)">Todas</div>
    <div class="tab" data-tab="contactos" onclick="setTab(this)">Contactos</div>
  </div>
</div>

<div class="content" id="content">
  <div class="empty"><div class="icon">⏳</div><p>Cargando...</p></div>
</div>

<div class="footer">Actualización automática cada 30 seg</div>

<script>
  const TOKEN = new URLSearchParams(location.search).get('token') || '';
  let tab = 'hoy';
  let data = [];
  let alerts = [];
  let leads = [];
  let prevAlertCount = null;

  // Pedir permiso para notificaciones del navegador
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }

  async function loadAlerts() {
    const res = await fetch('/api/alertas?token=' + TOKEN).catch(() => null);
    if (!res || !res.ok) return;
    alerts = await res.json();

    // Notificación del navegador si hay alertas nuevas (no en la primera carga)
    if (prevAlertCount !== null && alerts.length > prevAlertCount) {
      const nuevas = alerts.slice(0, alerts.length - prevAlertCount);
      nuevas.forEach(a => {
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('⚠️ Waikiki — Cliente solicita atención', { body: '📞 ' + a.telefono + '  ·  ' + a.timestamp });
        }
      });
    }
    prevAlertCount = alerts.length;
    renderAlerts();
  }

  function renderAlerts() {
    const section = document.getElementById('alerts-section');
    const list = document.getElementById('alerts-list');
    if (!alerts.length) { section.style.display = 'none'; return; }
    section.style.display = 'block';
    list.innerHTML = alerts.map(a =>
      '<div class="alert-card" id="al-' + a.id + '">' +
        '<div class="alert-icon">🚨</div>' +
        '<div class="alert-body">' +
          '<div class="alert-title">Cliente solicita hablar con una persona</div>' +
          '<div class="alert-sub">📞 ' + a.telefono + ' &nbsp;·&nbsp; ' + a.timestamp + '</div>' +
        '</div>' +
        '<button class="btn-dismiss" onclick="dismissAlert(\'' + a.id + '\')">✓ Atendido</button>' +
      '</div>'
    ).join('');
  }

  async function dismissAlert(id) {
    const res = await fetch('/api/alertas/' + id + '?token=' + TOKEN, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ leida: true })
    }).then(r => r.json()).catch(() => null);
    if (res) { alerts = alerts.filter(a => a.id !== id); renderAlerts(); }
  }

  // ── TABLA DE MESAS ──────────────────────────────────────
  const TABLES = [
    // Salón Ala Wai — estándar (2-5 pax)
    {n:200,s:'Ala Wai',min:2,max:5},{n:202,s:'Ala Wai',min:2,max:5},{n:204,s:'Ala Wai',min:2,max:5},
    {n:206,s:'Ala Wai',min:2,max:5},{n:208,s:'Ala Wai',min:2,max:5},{n:210,s:'Ala Wai',min:2,max:5},
    {n:212,s:'Ala Wai',min:2,max:5},{n:214,s:'Ala Wai',min:2,max:5},{n:216,s:'Ala Wai',min:2,max:5},
    {n:218,s:'Ala Wai',min:2,max:5},{n:220,s:'Ala Wai',min:2,max:5},{n:222,s:'Ala Wai',min:2,max:5},
    {n:224,s:'Ala Wai',min:2,max:5},{n:226,s:'Ala Wai',min:2,max:5},
    // Salón Ala Wai — grandes (7-10 pax)
    {n:201,s:'Ala Wai',min:7,max:10},{n:207,s:'Ala Wai',min:7,max:10},{n:213,s:'Ala Wai',min:7,max:10},
    // Pasillo — estándar (2-5 pax)
    {n:3,s:'Pasillo',min:2,max:5},{n:58,s:'Pasillo',min:2,max:5},{n:60,s:'Pasillo',min:2,max:5},
    {n:64,s:'Pasillo',min:2,max:5},{n:66,s:'Pasillo',min:2,max:5},
    // Pasillo — media (6-8 pax)
    {n:62,s:'Pasillo',min:6,max:8},
    // Panza — media (2-4 pax)
    {n:40,s:'Panza',min:2,max:4},{n:36,s:'Panza',min:2,max:4},{n:28,s:'Panza',min:2,max:4},
    {n:24,s:'Panza',min:2,max:4},{n:16,s:'Panza',min:2,max:4},{n:12,s:'Panza',min:2,max:4},
    // Panza — pequeña (1-2 pax)
    {n:34,s:'Panza',min:1,max:2},{n:32,s:'Panza',min:1,max:2},{n:30,s:'Panza',min:1,max:2},
    {n:22,s:'Panza',min:1,max:2},{n:20,s:'Panza',min:1,max:2},{n:18,s:'Panza',min:1,max:2},
    // Panza — grandes (7-10 pax)
    {n:11,s:'Panza',min:7,max:10},{n:17,s:'Panza',min:7,max:10},
  ];

  function mesaOpts(personas) {
    const pax = parseInt(personas) || 0;
    const rec   = TABLES.filter(t => pax >= t.min && pax <= t.max);
    const other = TABLES.filter(t => !(pax >= t.min && pax <= t.max));
    let html = '<option value="">Sin asignar</option>';
    if (rec.length) {
      html += '<optgroup label="' + (pax ? '★ Recomendadas (' + pax + ' pax)' : '★ Recomendadas') + '">';
      rec.forEach(t => { html += '<option value="' + t.n + '">' + t.n + ' · ' + t.s + ' (' + t.min + '–' + t.max + ' pax)</option>'; });
      html += '</optgroup>';
    }
    const sectors = [...new Set(other.map(t => t.s))];
    sectors.forEach(sec => {
      const ts = other.filter(t => t.s === sec);
      html += '<optgroup label="' + sec + '">';
      ts.forEach(t => { html += '<option value="' + t.n + '">' + t.n + ' (' + t.min + '–' + t.max + ' pax)</option>'; });
      html += '</optgroup>';
    });
    return html;
  }

  function arDate(offset) {
    const d = new Date(); d.setDate(d.getDate() + (offset || 0));
    const parts = new Intl.DateTimeFormat('es-AR', {
      timeZone: 'America/Argentina/Buenos_Aires', day: '2-digit', month: '2-digit',
    }).formatToParts(d);
    const day   = parts.find(p => p.type === 'day').value.padStart(2, '0');
    const month = parts.find(p => p.type === 'month').value.padStart(2, '0');
    return day + '/' + month;
  }

  function setTab(el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active'); tab = el.dataset.tab;
    if (tab === 'contactos') renderLeads(); else render();
  }

  function filter() {
    const hoy = arDate(0);
    if (tab === 'hoy') return data.filter(r => r.fechaReserva === hoy || r.fechaReserva === '-');
    if (tab === 'proximas') return data.filter(r => r.estado !== 'Cancelada');
    return data;
  }

  function sorted(list) {
    return [...list].sort((a, b) => {
      const fd = x => x.fechaReserva === '-' ? 'zz' : x.fechaReserva;
      if (fd(a) !== fd(b)) return fd(a).localeCompare(fd(b));
      return (a.horario || '').localeCompare(b.horario || '');
    });
  }

  function grouped(list) {
    const g = {};
    for (const r of list) { const k = r.fechaReserva || 'Sin fecha'; (g[k] = g[k] || []).push(r); }
    return g;
  }

  function card(r) {
    const tipo = r.tipo ? r.tipo[0].toUpperCase() + r.tipo.slice(1) : '—';
    const menuLabel = r.menu === 'sushi' ? '🍣 Sushi' : r.menu === 'carta' ? '📋 Carta' : tipo;
    const tel = r.telefono && r.telefono !== '-'
      ? '<a class="phone" href="tel:' + r.telefono + '">' + r.telefono + '</a>'
      : '<span>—</span>';

    const mesaInfo = r.mesa ? TABLES.find(t => t.n == r.mesa) : null;
    const mesaText = r.mesa
      ? '🪑 Mesa ' + r.mesa + (mesaInfo ? ' · ' + mesaInfo.s : '')
      : '🪑 Sin mesa';
    const mesaClass = 'mesa-chip' + (r.mesa ? ' set' : '');

    return (
      '<div class="card ' + r.estado + '" id="c' + r.id + '">' +
        '<div class="card-top">' +
          '<div>' +
            '<div class="card-name">' + r.nombre + '</div>' +
            '<span class="badge ' + r.estado + '">' + r.estado + '</span>' +
          '</div>' +
          '<div class="card-right">' +
            '<div class="card-time">' + (r.horario || '—') + '</div>' +
            '<div class="card-time-lbl">hs</div>' +
          '</div>' +
        '</div>' +
        '<div class="card-meta">' +
          '<div class="meta-item">👥 ' + r.personas + ' persona(s)</div>' +
          '<div class="meta-item">🍽️ ' + menuLabel + '</div>' +
          '<div class="meta-item">📅 ' + r.fechaReserva + '</div>' +
          '<div class="meta-item">📞 ' + tel + '</div>' +
        '</div>' +
        '<div class="divider"></div>' +
        '<div class="card-actions">' +
          '<button class="btn btn-ok" onclick="upd(\'' + r.id + '\',\'Confirmada\')" ' + (r.estado !== 'Pendiente' ? 'disabled' : '') + '>✓ Confirmar</button>' +
          '<button class="btn btn-ko" onclick="upd(\'' + r.id + '\',\'Cancelada\')" ' + (r.estado === 'Cancelada' ? 'disabled' : '') + '>✕ Cancelar</button>' +
        '</div>' +
        '<div class="mesa-row">' +
          '<span class="' + mesaClass + '" onclick="toggleMesa(\'' + r.id + '\')">' +
            mesaText + ' <span class="mesa-caret">▾</span>' +
          '</span>' +
        '</div>' +
        '<div class="mesa-panel" id="mp-' + r.id + '">' +
          '<div class="mesa-panel-title">Asignar mesa</div>' +
          '<select class="mesa-select" id="ms-' + r.id + '">' + mesaOpts(r.personas) + '</select>' +
          '<div class="mesa-actions">' +
            '<button class="btn btn-ok" onclick="saveMesa(\'' + r.id + '\')">✓ Guardar</button>' +
            '<button class="btn btn-ko" onclick="toggleMesa(\'' + r.id + '\')">✕ Cerrar</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  function toggleMesa(id) {
    const panel = document.getElementById('mp-' + id);
    panel.classList.toggle('open');
    if (panel.classList.contains('open')) {
      const r = data.find(r => r.id === id);
      if (r) document.getElementById('ms-' + id).value = r.mesa || '';
    }
  }

  async function saveMesa(id) {
    const mesa = document.getElementById('ms-' + id).value;
    const res = await fetch('/api/reservas/' + id + '?token=' + TOKEN, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ mesa })
    }).then(r => r.json()).catch(() => null);
    if (res) { const i = data.findIndex(r => r.id === id); if (i >= 0) data[i] = res; render(); }
  }

  function stats() {
    const hoy = arDate(0);
    document.getElementById('s-hoy').textContent = data.filter(r => r.fechaReserva === hoy).length;
    const pend = data.filter(r => r.estado === 'Pendiente').length;
    const el = document.getElementById('s-pend');
    el.textContent = pend; el.classList.toggle('warn', pend > 0);
    document.getElementById('s-conf').textContent = data.filter(r => r.estado === 'Confirmada').length;
  }

  function render() {
    const list = sorted(filter());
    const el = document.getElementById('content');
    if (!list.length) { el.innerHTML = '<div class="empty"><div class="icon">📭</div><p>Sin reservas para mostrar</p></div>'; return; }
    const g = grouped(list);
    const hoy = arDate(0), man = arDate(1);
    let html = '';
    for (const [date, items] of Object.entries(g)) {
      const lbl = date === hoy ? '📅 Hoy · ' + date
                : date === man ? '📅 Mañana · ' + date
                : date === '-' ? 'Sin fecha'
                : '📅 ' + date;
      html += '<div class="group-label">' + lbl + '</div>' + items.map(card).join('');
    }
    el.innerHTML = html;
  }

  async function upd(id, estado) {
    const res = await fetch('/api/reservas/' + id + '?token=' + TOKEN, {
      method: 'PATCH', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ estado })
    }).then(r => r.json()).catch(() => null);
    if (res) { const i = data.findIndex(r => r.id === id); if (i >= 0) data[i] = res; stats(); render(); }
  }

  function renderLeads() {
    const el = document.getElementById('content');
    const cvs   = leads.filter(l => l.tipo === 'cv');
    const shows = leads.filter(l => l.tipo === 'show');
    if (!leads.length) { el.innerHTML = '<div class="empty"><div class="icon">📭</div><p>Sin contactos todavía</p></div>'; return; }
    let html = '';
    if (cvs.length) {
      html += '<div class="lead-section-title">💼 CVs recibidos (' + cvs.length + ')</div>';
      html += cvs.map(l =>
        '<div class="lead-card">' +
          '<div class="lead-icon">💼</div>' +
          '<div class="lead-body">' +
            '<div class="lead-detalle">' + l.detalle + '</div>' +
            '<div class="lead-meta">📞 <a class="phone" href="tel:' + l.telefono + '">' + l.telefono + '</a> &nbsp;·&nbsp; ' + l.timestamp + '</div>' +
          '</div>' +
        '</div>'
      ).join('');
    }
    if (shows.length) {
      html += '<div class="lead-section-title">🎤 Shows ofrecidos (' + shows.length + ')</div>';
      html += shows.map(l =>
        '<div class="lead-card">' +
          '<div class="lead-icon">🎤</div>' +
          '<div class="lead-body">' +
            '<div class="lead-detalle">' + l.detalle + '</div>' +
            '<div class="lead-meta">📞 <a class="phone" href="tel:' + l.telefono + '">' + l.telefono + '</a> &nbsp;·&nbsp; ' + l.timestamp + '</div>' +
          '</div>' +
        '</div>'
      ).join('');
    }
    el.innerHTML = html;
  }

  async function loadLeads() {
    const res = await fetch('/api/leads?token=' + TOKEN).catch(() => null);
    if (!res || !res.ok) return;
    leads = await res.json();
    if (tab === 'contactos') renderLeads();
  }

  async function load() {
    const res = await fetch('/api/reservas?token=' + TOKEN).catch(() => null);
    if (!res || !res.ok) { document.getElementById('content').innerHTML = '<div class="empty"><div class="icon">🔒</div><p>Token inválido</p></div>'; return; }
    data = await res.json();
    if (tab !== 'contactos') { stats(); render(); }
    await loadAlerts();
    await loadLeads();
    const t = new Date().toLocaleTimeString('es-AR', { timeZone: 'America/Argentina/Buenos_Aires', hour: '2-digit', minute: '2-digit' });
    document.getElementById('last-update').textContent = t;
  }

  load();
  setInterval(load, 30000);
</script>
</body>
</html>
